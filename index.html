<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniBot</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background: radial-gradient(circle at top, #6a007a, #1a001f);
    font-family: Arial;
    text-align:center;
    color:white;
}

/* Sakura */
.sakura{
    position:absolute;
    top:-50px;
    width:18px;
    height:18px;
    background: radial-gradient(circle at 30% 30%, #ffc0cb, #ff69b4);
    border-radius: 50% 50% 50% 0;
    transform: rotate(45deg);
    opacity:0.8;
    animation: fall linear infinite;
}

@keyframes fall{
    to{
        transform: translateY(110vh) rotate(720deg);
    }
}

/* Container */
.container{
    position:relative;
    z-index:10;
    margin-top:80px;
}

/* Logo circle */
.circle{
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto;
    position:relative;
    box-shadow:0 0 40px #ff00ff;
}

/* Circular wave */
.ring{
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    border:4px solid #ff00ff;
    animation: pulse 1.5s infinite;
    opacity:0.6;
}

@keyframes pulse{
    0%{ transform: scale(1); opacity:0.6;}
    50%{ transform: scale(1.2); opacity:0.2;}
    100%{ transform: scale(1); opacity:0.6;}
}

.logo{
    width:140px;
}

h1{
    font-size:60px;
    color:#ff66ff;
    text-shadow:0 0 25px #ff00ff;
}

/* Settings panel */
.settings{
    position:fixed;
    right:20px;
    top:20px;
    background:rgba(0,0,0,0.6);
    padding:15px;
    border-radius:15px;
    box-shadow:0 0 20px #ff00ff;
    font-size:14px;
}

.settings input{
    width:100%;
}

.status{
    margin-top:20px;
    color:#ffccff;
}
</style>
</head>

<body>

<div class="container">

<div class="circle">
    <div class="ring"></div>
    <img src="anikai.png" class="logo">
</div>

<h1>AniBot</h1>

<p class="status" id="status">Dinlemeye Hazır...</p>

</div>

<!-- Ayarlar -->
<div class="settings">
<b>Ayarlar</b><br><br>

Ses Seviyesi
<input type="range" id="volume" min="0" max="1" step="0.1" value="1">

Konuşma Hızı
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">

<br><br>
<button onclick="toggleMic()">Mikrofon Aç/Kapat</button>
</div>

<script>

/* Sakura */
function createSakura(){
    const sakura = document.createElement("div");
    sakura.classList.add("sakura");
    sakura.style.left = Math.random() * window.innerWidth + "px";
    sakura.style.animationDuration = (6 + Math.random()*4) + "s";
    document.body.appendChild(sakura);
    setTimeout(()=>{ sakura.remove(); },10000);
}
setInterval(createSakura,400);

/* Ses Sistemi */
const statusText = document.getElementById("status");
const volumeSlider = document.getElementById("volume");
const rateSlider = document.getElementById("rate");

let recognition;
let micActive = true;

if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
} else if ('SpeechRecognition' in window) {
    recognition = new SpeechRecognition();
}

if(recognition){
    recognition.lang = "tr-TR";
    recognition.continuous = true;

    recognition.onresult = function(event){
        const userText = event.results[event.results.length-1][0].transcript;
        statusText.innerHTML = "Sen: " + userText;
        speak("Seni duydum.");
    }

    recognition.onend = function(){
        if(micActive) recognition.start();
    }

    recognition.start();
}

function toggleMic(){
    if(micActive){
        micActive = false;
        recognition.stop();
        statusText.innerHTML = "Mikrofon Kapalı";
    }else{
        micActive = true;
        recognition.start();
        statusText.innerHTML = "Dinliyorum...";
    }
}

function speak(text){
    window.speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "tr-TR";
    speech.volume = volumeSlider.value;
    speech.rate = rateSlider.value;
    speech.pitch = 1.2;
    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
