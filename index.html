<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>AniKai Voice Bot</title>
</head>
<body style="text-align:center; font-family:Arial; background:#111; color:white;">

<h1>AniKai Voice Bot 🎙️</h1>

<!-- Logo -->
<img src="anikai.png" width="200" alt="AniKai Logo">

<br><br>

<button onclick="startListening()" style="padding:10px 20px; font-size:16px;">
🎤 Konuşmaya Başla
</button>

<p id="text"></p>

<script>
const textOutput = document.getElementById("text");

function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "tr-TR";
    window.speechSynthesis.speak(speech);
}

function startListening() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "tr-TR";
    recognition.start();

    recognition.onresult = function(event) {
        const userText = event.results[0][0].transcript;
        textOutput.innerHTML = "Sen: " + userText;

        let response = "Seni duydum.";

        if (userText.includes("merhaba")) {
            response = "Merhaba! Ben AniKai.";
        }

        if (userText.includes("nasılsın")) {
            response = "Harikayım! Sen nasılsın?";
        }

        speak(response);
    };
}
</script>

</body>
</html>
