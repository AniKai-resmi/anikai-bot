<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniBot</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background: radial-gradient(circle at top, #6a007a, #1a001f);
    font-family: Arial, sans-serif;
    text-align:center;
    color:white;
}

/* Sakura yaprak */
.sakura{
    position:absolute;
    top:-50px;
    width:20px;
    height:20px;
    background: radial-gradient(circle at 30% 30%, #ffc0cb, #ff69b4);
    border-radius: 50% 50% 50% 0;
    transform: rotate(45deg);
    opacity:0.8;
    animation: fall linear infinite;
}

@keyframes fall{
    to{
        transform: translateY(110vh) rotate(720deg);
    }
}

/* Ortadaki alan */
.container{
    position:relative;
    z-index:10;
    margin-top:100px;
}

/* Daire */
.circle{
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 30px auto;
    box-shadow:0 0 40px #ff00ff;
}

/* Logo */
.logo{
    width:140px;
}

/* Başlık */
h1{
    font-size:60px;
    color:#ff66ff;
    text-shadow:0 0 25px #ff00ff;
}

/* Ses dalgası */
.wave{
    margin:30px auto;
    width:200px;
    height:40px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
}

.bar{
    width:10px;
    height:10px;
    background:#ff00ff;
    animation:wave 1s infinite ease-in-out;
}

.bar:nth-child(2){ animation-delay:0.1s; }
.bar:nth-child(3){ animation-delay:0.2s; }
.bar:nth-child(4){ animation-delay:0.3s; }
.bar:nth-child(5){ animation-delay:0.4s; }

@keyframes wave{
    0%,100%{ height:10px; }
    50%{ height:40px; }
}

.status{
    margin-top:20px;
    color:#ffccff;
}
</style>
</head>

<body>

<div class="container">

<div class="circle">
    <img src="anikai.png" class="logo">
</div>

<h1>AniBot</h1>

<div class="wave">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
</div>

<p class="status" id="status">Dinlemeye Hazır...</p>

</div>

<script>

/* Gerçek sakura üretimi */
function createSakura(){
    const sakura = document.createElement("div");
    sakura.classList.add("sakura");

    sakura.style.left = Math.random() * window.innerWidth + "px";
    sakura.style.animationDuration = (6 + Math.random()*4) + "s";

    document.body.appendChild(sakura);

    setTimeout(()=>{
        sakura.remove();
    },10000);
}

setInterval(createSakura,400);

/* Ses sistemi */
const statusText = document.getElementById("status");
let recognition;

if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
} else if ('SpeechRecognition' in window) {
    recognition = new SpeechRecognition();
}

if(recognition){
    recognition.lang = "tr-TR";
    recognition.continuous = true;

    recognition.onstart = function(){
        statusText.innerHTML = "Seni dinliyorum... 🎧";
    }

    recognition.onresult = function(event){
        const userText = event.results[event.results.length-1][0].transcript;
        statusText.innerHTML = "Sen: " + userText;
        speak("Seni duydum.");
    }

    recognition.onend = function(){
        recognition.start();
    }

    recognition.start();
}

/* Sesli cevap */
function speak(text){
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "tr-TR";
    speech.pitch = 1.2;
    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
